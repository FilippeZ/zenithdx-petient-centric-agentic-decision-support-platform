# ─────────────────────────────────────────────────────────────────────────────
#  ZenithDx – Production Docker Compose
#  Services: postgres (pgvector), ollama, fastapi backend
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

networks:
  zenithdx_net:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
  backend_uploads:

services:

  # ─────────────────────────────────────────────────────────────────────────
  #  PostgreSQL + pgvector
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zenithdx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenithdx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenithdxsecret}
      POSTGRES_DB: ${POSTGRES_DB:-zenithdx_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenithdx} -d ${POSTGRES_DB:-zenithdx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenithdx_net

  # ─────────────────────────────────────────────────────────────────────────
  #  Ollama – Local LLM Host (Doctor2 fine-tuned model / Llama 3.2 3B)
  # ─────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: zenithdx_ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
      - ./model:/model:ro
      - ./ollama:/ollama:ro
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_MODELS: /root/.ollama/models
    # Build doctor2 fine-tuned model on first startup
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             (ollama create doctor2 -f /ollama/Modelfile || ollama pull llama3.2:3b) &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - zenithdx_net

  # ─────────────────────────────────────────────────────────────────────────
  #  FastAPI Backend
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenithdx_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Application
      APP_NAME: "ZenithDx API"
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-zenithdx_db}
      DB_USER: ${POSTGRES_USER:-zenithdx}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-zenithdxsecret}
      # Ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-doctor2}
      # CORS
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/weights:/app/weights:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - zenithdx_net
